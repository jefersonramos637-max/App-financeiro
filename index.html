<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#146c5b">
<meta name="description" content="Controle financeiro pessoal: receitas, despesas, orçamento por categoria e metas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Bolso">
<title>Meu Bolso</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- app:start -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-logo">
    <svg viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#146c5b"/><rect x="104" y="150" width="304" height="232" rx="36" fill="#fff"/><path d="M104 206h304" stroke="#146c5b" stroke-width="22"/><rect x="300" y="250" width="108" height="76" rx="22" fill="#dcefe9"/><circle cx="340" cy="288" r="14" fill="#146c5b"/><path d="M168 300l40-40 36 30 46-56" fill="none" stroke="#eb6834" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <div class="splash-name">Meu Bolso</div>
  <div class="splash-dots"><span></span><span></span><span></span></div>
</div>
<header class="topbar">
  <div class="month-nav">
    <button id="prevMonth" class="icon-btn" type="button" aria-label="Mês anterior">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button id="monthLabel" class="month-label" type="button" aria-label="Voltar para o mês atual">Mês</button>
    <button id="nextMonth" class="icon-btn" type="button" aria-label="Próximo mês">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="top-actions">
    <button id="privacyBtn" class="icon-btn" type="button" aria-label="Esconder valores" aria-pressed="false"></button>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Configurações e backup">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </button>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<button id="fab" class="fab" type="button" aria-label="Adicionar gasto ou ganho">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  <span>Adicionar</span>
</button>

<nav class="tabbar" aria-label="Seções">
  <button type="button" data-tab="home" class="active">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
    <span>Início</span>
  </button>
  <button type="button" data-tab="transactions">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
    <span>Extrato</span>
  </button>
  <button type="button" data-tab="debts">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10l9-6 9 6M5 10v8M9.7 10v8M14.3 10v8M19 10v8M3 21h18"/></svg>
    <span>Dívidas</span>
  </button>
  <button type="button" data-tab="budget">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
    <span>Limites</span>
  </button>
  <button type="button" data-tab="goals">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>
    <span>Metas</span>
  </button>
</nav>

<div id="sheet" class="sheet-backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div id="sheetContent"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<!-- app:end -->
<script src="app.js"></script>
</body>
</html>
